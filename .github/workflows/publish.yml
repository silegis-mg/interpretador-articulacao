# Publica o pacote no npm quando uma tag de versão (v*) é enviada ao GitHub.
# Usa trusted publishing (OIDC): não há token do npm guardado no repositório,
# e o pacote é publicado com atestado de procedência (provenance).

name: Publicação no npm

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:

    runs-on: ubuntu-latest
    environment: npm

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    - name: Confere tag com a versão do package.json
      run: |
        versao="v$(node -p "require('./package.json').version")"
        if [ "$versao" != "$GITHUB_REF_NAME" ]; then
          echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $versao do package.json."
          exit 1
        fi
    - run: npm ci
    - run: npm publish
